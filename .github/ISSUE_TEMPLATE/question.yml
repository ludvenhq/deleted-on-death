name: Question or install help
description: The mod does not load, or something in the rules is unclear.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, NeoForge, KubeJS, KubeLoader and Deleted on Death, and the launcher you use.
      placeholder: Minecraft 1.21.1, NeoForge 21.1.x, KubeJS 2101.7.x, KubeLoader x, Deleted on Death 0.1.0, CurseForge app
